[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "api-data-collector"
version = "0.1.0"
description = "A Python automation project for collecting and exporting REST API data."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true